<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Visual Arts & Media</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-zinc-800 p-6 flex justify-between items-center max-w-7xl mx-auto">
    <h1 class="text-xl font-bold tracking-tight text-white">PORTFOLIO</h1>
    <a href="#contact" class="px-4 py-2 bg-amber-500 text-zinc-950 font-semibold rounded-lg hover:bg-amber-400 text-sm">
      Get in Touch
    </a>
  </header>

  <!-- Hero Section -->
  <section class="max-w-7xl mx-auto px-6 py-20 text-center">
    <p class="text-amber-400 font-mono text-sm tracking-wider uppercase mb-2">Visual Gallery & Media</p>
    <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">Capturing Moments, Oceans & Wilds</h2>
    <p class="text-zinc-400 max-w-xl mx-auto text-base md:text-lg">
      A collection of high-resolution stills, expedition footage, and documentary visual work.
    </p>
  </section>

  <!-- Gallery Grid -->
<section class="max-w-7xl mx-auto px-6 pb-24">
  <!-- Container where images will be added dynamically -->
  <div id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <!-- Optional: Loading indicator while photos load -->
    <div id="loading" class="col-span-full text-center py-12 text-zinc-500">
      Loading photos...
    </div>
  </div>
</section>

<!-- Automatic Gallery Script -->
<script>
  // 1. Set your GitHub username and repository name here
  const GITHUB_USERNAME = "carlosmaredi"; 
  const GITHUB_REPO = "portfolio_website";
  const IMAGES_FOLDER = "images";

  async function loadImagesFromRepo() {
    const container = document.getElementById("gallery-container");
    const loading = document.getElementById("loading");

    try {
      // Fetch the file list of the images folder using GitHub's public API
      const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${IMAGES_FOLDER}`;
      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error(`GitHub API Error: ${response.status}`);
      }

      const files = await response.json();

      // Remove loading indicator
      //if (loading) loading.remove();

      // Filter only image files (jpg, jpeg, png, webp, gif)
      const validExtensions = /\.(jpe?g|png|webp|gif)$/i;
      const imageFiles = files.filter(file => file.type === "file" && validExtensions.test(file.name));

      // Loop through each photo and generate a card
      imageFiles.forEach(file => {
        // Clean up filename to create a nice title (e.g., "furor_atunero.jpg" -> "Furor Atunero")
        const rawName = file.name.substring(0, file.name.lastIndexOf('.'));
        const formattedTitle = rawName
          .replace(/[_-]/g, ' ')
          .replace(/\b\w/g, char => char.toUpperCase());

        const card = document.createElement("div");
        card.className = "group relative rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 shadow-md";

        card.innerHTML = `
          <div class="overflow-hidden">
            <img 
              src="${file.path}" 
              alt="${formattedTitle}" 
              loading="lazy"
              class="w-full h-72 object-cover transition-transform duration-300 group-hover:scale-105" 
            />
          </div>
          <div class="p-4 bg-zinc-900/90 border-t border-zinc-800 flex justify-between items-center">
            <div>
              <h3 class="text-base font-semibold text-white">${formattedTitle}</h3>
              <p class="text-xs text-zinc-400">Photography</p>
            </div>
            <a href="${file.path}" target="_blank" class="text-xs text-amber-500 hover:text-amber-400 font-medium">
              View Full
            </a>
          </div>
        `;

        container.appendChild(card);
      });

    } catch (error) {
      console.error("Error loading gallery:", error);
      if (loading) {
        loading.innerHTML = `<p class="text-red-400">Could not load images. Check repository configuration.</p>`;
      }
    }
  }

  // Run the function when the page loads
  loadImagesFromRepo();
</script>
  </section>

  <!-- Footer / Contact -->
  <footer id="contact" class="border-t border-zinc-800 py-12 text-center text-sm text-zinc-500">
    <p>&copy; 2026 Portfolio. Built with GitHub Pages.</p>
  </footer>

</body>
</html>
